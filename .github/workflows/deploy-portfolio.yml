name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js with pnpm
      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v3
        with:
          node-version: 18
          # cache: "pnpm" # Cache dependencies for faster builds

      # Install pnpm
      - name: Install pnpm
        run: |
          npm install -g pnpm

      # Install dependencies in the monorepo
      - name: Install dependencies
        run: |
          pnpm install

      # Build the library package
      - name: Build library package
        working-directory: libs/react # Adjust to your library's directory
        run: |
          pnpm run build

      # Build the portfolio app
      - name: Build portfolio
        working-directory: apps/portfolio # Adjust to your portfolio's directory
        run: |
          pnpm run build

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PIT_TOKEN }}
          publish_dir: apps/portfolio/dist # Adjust to your portfolio's build output
