version: "3.8"

services:
  admin:
    build:
      context: .
      dockerfile: ./apps/admin/docker/Dockerfile
    ports:
      - "4001:4001"

  api:
    build:
      context: .
      dockerfile: ./apps/api/docker/Dockerfile
    ports:
      - "4000:4000"

  blogs:
    build:
      context: .
      dockerfile: ./apps/blogs/docker/Dockerfile
    ports:
      - "4002:4002"

  portfolio:
    build:
      context: .
      dockerfile: ./apps/portfolio/docker/Dockerfile
    ports:
      - "4003:4003"

  portfolio-nextjs:
    build:
      context: .
      dockerfile: ./apps/portfolio-nextjs/docker/Dockerfile
    ports:
      - "3000:3000"
  # Define a network for services that need to communicate with each other
  public:
    driver: bridge

volumes:
  # Define named volumes here if needed
  local:
